real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $request_method $atproto_create_limit_key {
    default "";
    POST    $binary_remote_addr;
}

map $http_origin $atproto_create_cors_origin {
    default "";
    "~^https://([a-z0-9-]+\.)*blacksky\.community$" $http_origin;
    "~^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$" $http_origin;
}

limit_req_zone $atproto_create_limit_key zone=atproto_create:10m rate=20r/m;

server {
    listen      [::]:80 ipv6only=off;
    listen      [::]:443 ipv6only=off ssl http2;
    server_name _;

    ssl_certificate /etc/nginx/certs/snakeoil.cert.pem;
    ssl_certificate_key /etc/nginx/certs/snakeoil.key.pem;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.1 TLSv1;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA26';
    ssl_prefer_server_ciphers on;

    # Serve atproto OAuth client metadata at the root domain
    location = /oauth-client-metadata.json {
        rewrite ^ /oauth-client-metadata.json break;
        proxy_pass http://client-participation-alpha:4321;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }

    # Atproto OAuth callback — route to Astro app
    location = /auth/callback {
        rewrite ^ /auth/callback break;
        proxy_pass http://client-participation-alpha:4321;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }

    location /_astro/ {
        proxy_pass http://client-participation-alpha:4321;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /alpha/ {
        # This rule removes the /alpha prefix before sending to the container.
        # e.g., /alpha/embed.js becomes /embed.js
        # e.g., /alpha/9hhmb5fufv becomes /9hhmb5fufv
        rewrite ^/alpha/(.*)$ /$1 break;

        proxy_pass http://client-participation-alpha:4321;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Conversation IDs: route to Astro participation app (matches production behavior).
    # Conversation IDs start with a digit followed by alphanumeric chars.
    location ~ "^/[0-9][0-9A-Za-z]{2,}$" {
        proxy_pass http://client-participation-alpha:4321;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ~* "^/api/v3/atproto/conversations/?$" {
        limit_req zone=atproto_create burst=10 nodelay;
        limit_req_status 429;
        error_page 429 @atproto_create_limited;

        proxy_pass http://server:${API_SERVER_PORT};
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location @atproto_create_limited {
        default_type application/json;
        add_header Retry-After 3 always;
        add_header Access-Control-Allow-Origin $atproto_create_cors_origin always;
        add_header Vary Origin always;
        return 429 '{"error":"polis_err_atproto_conversation_rate_limited","message":"polis_err_atproto_conversation_rate_limited","status":429}';
    }

    # (Fallback): All other requests go to the main backend server.
    location / {
        proxy_pass http://server:${API_SERVER_PORT};
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        # Add timeout configurations
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
