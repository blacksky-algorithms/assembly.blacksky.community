server {
    listen 5000;
    listen 4321;
    default_type text/plain;

    location / {
        if ($http_x_stub_status = "429") {
            return 429 'upstream-429';
        }
        return 200 'xff=[$http_x_forwarded_for] proto=[$http_x_forwarded_proto] host=[$http_host] method=[$request_method] uri=[$request_uri]';
    }
}
